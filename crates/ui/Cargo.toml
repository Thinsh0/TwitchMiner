[package]
name = "tm-ui"
description = "Native TwitchMiner interface (Slint), shared by the desktop and Android launchers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tm-app.workspace = true
tm-client.workspace = true
tm-core.workspace = true
tokio.workspace = true
serde.workspace = true
async-trait.workspace = true
serde_json.workspace = true
chrono.workspace = true
anyhow.workspace = true
tracing.workspace = true
open.workspace = true
image.workspace = true
reqwest.workspace = true
# SHA-256 of downloaded updates (already used by rustls).
ring = "0.17"

[target.'cfg(not(target_os = "android"))'.dependencies]
# unstable-winit-030: window attributes (open without stealing the focus).
slint = { workspace = true, features = ["unstable-winit-030"] }
arboard = { version = "3", default-features = false }

# The Android launcher (`apps/android`) initialises this backend before `run`.
[target.'cfg(target_os = "android")'.dependencies]
slint = { workspace = true, features = ["backend-android-activity-06"] }

[dev-dependencies]
tm-modules.workspace = true
schemars.workspace = true
i-slint-backend-testing = "=1.18.1"

[build-dependencies]
slint-build.workspace = true
