[package]
name = "twitchminer-desktop"
description = "TwitchMiner desktop application (Windows, Linux)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "twitchminer-desktop"
path = "src/main.rs"

[dependencies]
tm-ui.workspace = true
tokio.workspace = true
anyhow.workspace = true
image.workspace = true
# ksni: tray icon over D-Bus on Linux (pure Rust, no GTK).
tray-icon = { version = "0.26", default-features = false, features = ["ksni"] }
auto-launch = "0.6"
# System notifications while the window is hidden (D-Bus on Linux, WinRT on Windows).
notify-rust = "4"
