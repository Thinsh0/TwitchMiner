name: Release

# Either push a `v*` tag, or run it by hand (Actions › Release › Run workflow) with the
# version: the workflow then creates the tag on the chosen commit itself. Running it
# again for an existing release rebuilds its tag and replaces the files.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to create, e.g. v0.1.1 (must match the Cargo version)"
        required: true

permissions:
  contents: write

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  # Same as the CI: part of the cache key (see the rust-cache steps).
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  # One job creates the release, so the build jobs never race to create it.
  create:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: create the release (an existing one is kept)
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists: its files are rebuilt from the tag and replaced"
            exit 0
          fi
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the Cargo version v$version (the update notice compares them)"
            exit 1
          fi
          cat > notes.md <<EOF
          **Windows** : télécharger \`TwitchMiner-$TAG-windows.exe\`, le placer dans un dossier où il restera (par exemple \`C:\\Programmes\\TwitchMiner\\\`) et le lancer. Il s'ajoute au menu Démarrer et aux applications installées. Pour mettre à jour : quitter l'app (icône de la barre système › Quitter) et remplacer l'exe.
          L'archive \`.zip\` contient aussi le daemon en ligne de commande (\`twitchminer.exe\`).

          **Linux** : archive \`x86_64-unknown-linux-gnu\` (app de bureau + daemon) ou \`musl\` (daemon statique). **Android** : voir \`docs/ANDROID.md\`.
          EOF
          gh release create "$TAG" --target "$GITHUB_SHA" --title "TwitchMiner $TAG" --notes-file notes.md --generate-notes

  build:
    needs: create
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, archive: tar.gz, musl: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      # The tagged commit, so the files always match the tag.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      # The dependencies the CI built on main (same shared key): only the workspace
      # crates and the final link are left to build.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.target }}
          save-if: false
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p twitchminer
      # Desktop application (not for the static musl build).
      - if: "!matrix.musl && runner.os == 'Linux'"
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - if: "!matrix.musl"
        run: cargo build --release --locked --target ${{ matrix.target }} -p twitchminer-desktop
      - name: package
        shell: bash
        run: |
          name=twitchminer-${TAG}-${{ matrix.target }}
          dir=target/${{ matrix.target }}/release
          mkdir "$name"
          cp README.md "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp $dir/twitchminer.exe $dir/twitchminer-desktop.exe "$name/"
            7z a "$name.zip" "$name"
            # The desktop application alone: the simplest download on Windows.
            cp $dir/twitchminer-desktop.exe "TwitchMiner-${TAG}-windows.exe"
          else
            cp $dir/twitchminer "$name/"
            if [ -f $dir/twitchminer-desktop ]; then cp $dir/twitchminer-desktop "$name/"; fi
            tar czf "$name.tar.gz" "$name"
          fi
      # Only adds the files (never edits the release itself).
      - name: upload
        shell: bash
        run: |
          shopt -s nullglob
          files=(twitchminer-*.zip twitchminer-*.tar.gz TwitchMiner-*.exe)
          gh release upload "$TAG" "${files[@]}" --clobber

  android:
    needs: create
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.target }}
          save-if: false
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk --target ${{ matrix.target }} --platform 26 build --release --locked -p tm-android -p twitchminer
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: package
        run: |
          name=twitchminer-${TAG}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/twitchminer target/${{ matrix.target }}/release/libtwitchminer_jni.so crates/android/kotlin/Native.kt docs/ANDROID.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - name: upload
        run: gh release upload "$TAG" twitchminer-*.tar.gz --clobber
