name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu, archive: tar.gz }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, archive: tar.gz, musl: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, archive: zip }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked --target ${{ matrix.target }} -p twitchminer
      - name: package
        shell: bash
        run: |
          name=twitchminer-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp README.md "$name/"
          if [ "${{ matrix.archive }}" = zip ]; then
            cp target/${{ matrix.target }}/release/twitchminer.exe "$name/"
            7z a "$name.zip" "$name"
          else
            cp target/${{ matrix.target }}/release/twitchminer "$name/"
            tar czf "$name.tar.gz" "$name"
          fi
      - uses: softprops/action-gh-release@v2
        with:
          files: twitchminer-*.*

  android:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      - run: cargo ndk --target ${{ matrix.target }} --platform 26 build --release --locked -p tm-android -p twitchminer
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - name: package
        run: |
          name=twitchminer-${GITHUB_REF_NAME}-${{ matrix.target }}
          mkdir "$name"
          cp target/${{ matrix.target }}/release/twitchminer target/${{ matrix.target }}/release/libtwitchminer_jni.so crates/android/kotlin/Native.kt docs/ANDROID.md "$name/"
          tar czf "$name.tar.gz" "$name"
      - uses: softprops/action-gh-release@v2
        with:
          files: twitchminer-*.tar.gz
