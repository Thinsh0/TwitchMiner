name: CI

# Everything happens on main: one run per commit (no copies on other branches).
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: fmt · clippy · tests
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # Slint (desktop interface) links against fontconfig and xkbcommon on Linux.
      - run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  build:
    name: build ${{ matrix.target }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04, target: x86_64-unknown-linux-musl, musl: true }
          # ARM (Raspberry Pi, ARM mini PCs, Docker arm64): cross-built with zig, which
          # brings the C toolchain sqlite and ring need.
          - { os: ubuntu-22.04, target: aarch64-unknown-linux-musl, musl: true, zig: true }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: build-${{ matrix.target }}
      - if: matrix.musl && !matrix.zig
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - if: matrix.zig
        run: pip install ziglang cargo-zigbuild
      - if: runner.os == 'Windows'
        run: cargo test --workspace --locked
      # These binaries are the ones the Release workflow publishes (it rebuilds nothing).
      - run: cargo ${{ matrix.zig && 'zigbuild' || 'build' }} --release --locked --target ${{ matrix.target }} -p twitchminer
      # Desktop application (not for the static musl build).
      - if: "!matrix.musl && runner.os == 'Linux'"
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev
      - if: "!matrix.musl"
        run: cargo build --release --locked --target ${{ matrix.target }} -p twitchminer-desktop
      - uses: actions/upload-artifact@v4
        with:
          name: twitchminer-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/twitchminer
            target/${{ matrix.target }}/release/twitchminer.exe
            target/${{ matrix.target }}/release/twitchminer-desktop
            target/${{ matrix.target }}/release/twitchminer-desktop.exe
          if-no-files-found: error

  android:
    name: build android (${{ matrix.target }})
    needs: check
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        target: [aarch64-linux-android, x86_64-linux-android]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: android-${{ matrix.target }}
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      - run: cargo install cargo-ndk --locked
      # libtwitchminer_jni.so (JNI bridge embedding the engine) and the daemon (runs in Termux).
      - run: cargo ndk --target ${{ matrix.target }} --platform 26 build --release --locked -p tm-android -p twitchminer
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
      - uses: actions/upload-artifact@v4
        with:
          name: twitchminer-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/twitchminer
            target/${{ matrix.target }}/release/libtwitchminer_jni.so

  # The Android application (apps/android): remote client APK, arm64.
  apk:
    name: build android app (apk)
    needs: check
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: apk-aarch64-linux-android
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r27c
      # Slint compiles a small Java helper to dex: JDK 17 (21 trips older build tools).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - run: cargo install cargo-ndk --locked
      # A private signing key when the repository has one (secrets ANDROID_KEYSTORE as
      # base64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS), else the public test key.
      - name: signing key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          fi
      - run: packaging/android/build-apk.sh "$PWD/apk/TwitchMiner.apk"
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD || 'android' }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS || 'twitchminer' }}
      - uses: actions/upload-artifact@v4
        with:
          name: twitchminer-android-apk
          path: apk/TwitchMiner.apk
