name: Release

# Publishes the binaries the CI already built for the commit (nothing is recompiled)
# and the Docker image (amd64 + arm64). Either push a `v*` tag, or run it by hand
# (Actions › Release › Run workflow) with the version: the tag is then created on the
# commit. The CI must have passed on that commit. Running it again for an existing
# release replaces its files and the image.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag, e.g. v0.1.2 (must match the Cargo version)"
        required: true

permissions:
  contents: write
  packages: write
  actions: read

env:
  TAG: ${{ inputs.tag || github.ref_name }}
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  release:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: find the commit and its CI run
        id: ci
        shell: bash
        run: |
          # An existing tag wins (re-run); otherwise the commit this workflow runs on.
          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            sha=$(git rev-parse "$TAG^{commit}")
          else
            sha=$GITHUB_SHA
          fi
          run=$(gh run list --workflow ci.yml --commit "$sha" --status success --limit 1 --json databaseId -q '.[0].databaseId')
          if [ -z "$run" ]; then
            echo "::error::no successful CI run for $sha yet: wait for the CI to pass, then run this again"
            exit 1
          fi
          git checkout -q "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          echo "run=$run" >> "$GITHUB_OUTPUT"
          echo "commit $sha, CI run $run"
      - name: create the release (an existing one is kept)
        shell: bash
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG exists: its files are replaced"
            exit 0
          fi
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          if [ "$TAG" != "v$version" ]; then
            echo "::error::tag $TAG does not match the Cargo version v$version (the update notice compares them)"
            exit 1
          fi
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          cat > notes.md <<EOF
          **Windows** : télécharger \`TwitchMiner-$TAG-windows.exe\`, le placer dans un dossier où il restera (par exemple \`C:\\Programmes\\TwitchMiner\\\`) et le lancer. Il s'ajoute au menu Démarrer et aux applications installées. Ensuite, l'app se met à jour seule (carte « Mettre à jour » dans À faire).
          L'archive \`.zip\` contient aussi le daemon en ligne de commande (\`twitchminer.exe\`).

          **Serveur (Docker, amd64 et arm64)** : \`docker run -d --name twitchminer --restart unless-stopped -v twitchminer:/data -p 7878:7878 $image:${TAG#v}\` (voir \`docs/SERVER.md\`).

          **Android** : \`TwitchMiner-$TAG-android.apk\`, l'appli qui suit et pilote ton serveur TwitchMiner depuis le téléphone (Tailscale ou réseau local). L'installer en autorisant les sources inconnues (voir \`docs/ANDROID.md\`).

          **Linux** : \`x86_64-unknown-linux-gnu\` (app de bureau + daemon), \`x86_64-unknown-linux-musl\` et \`aarch64-unknown-linux-musl\` (daemon statique, sans dépendance). Archives \`*-linux-android\` : moteur Android (daemon pour Termux, pont JNI).
          EOF
          gh release create "$TAG" --target "${{ steps.ci.outputs.sha }}" --title "TwitchMiner $TAG" --notes-file notes.md --generate-notes
      - name: download the CI binaries
        run: gh run download "${{ steps.ci.outputs.run }}" -D ci
      - name: package
        shell: bash
        run: |
          for d in ci/twitchminer-*/; do
            target=$(basename "$d"); target=${target#twitchminer-}
            name=twitchminer-$TAG-$target
            mkdir -p "$name"
            case $target in
              android-apk)
                # The Android application.
                cp "$d/TwitchMiner.apk" "TwitchMiner-$TAG-android.apk"
                rmdir "$name"
                continue
                ;;
              *windows*)
                cp README.md "$d"/*.exe "$name/"
                zip -qr "$name.zip" "$name"
                # The desktop application alone: the simplest download on Windows.
                cp "$d/twitchminer-desktop.exe" "TwitchMiner-$TAG-windows.exe"
                ;;
              *android*)
                cp "$d/twitchminer" "$d/libtwitchminer_jni.so" crates/android/kotlin/Native.kt docs/ANDROID.md "$name/"
                chmod +x "$name/twitchminer"
                tar czf "$name.tar.gz" "$name"
                ;;
              *)
                # Artifacts do not keep the executable bit.
                cp README.md "$d"/twitchminer* "$name/"
                chmod +x "$name"/twitchminer*
                tar czf "$name.tar.gz" "$name"
                ;;
            esac
          done
          ls -l ./*.zip ./*.tar.gz ./*.exe ./*.apk
      - name: upload
        shell: bash
        run: gh release upload "$TAG" ./*.zip ./*.tar.gz ./*.exe ./*.apk --clobber

      # Docker image from the static binaries: amd64 and arm64.
      - name: prepare the image
        shell: bash
        run: |
          mkdir -p image/bin/amd64 image/bin/arm64
          cp ci/twitchminer-x86_64-unknown-linux-musl/twitchminer image/bin/amd64/
          cp ci/twitchminer-aarch64-unknown-linux-musl/twitchminer image/bin/arm64/
          chmod +x image/bin/*/twitchminer
          cp packaging/docker/Dockerfile image/
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
          echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        with:
          context: image
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.VERSION }}
            ${{ env.IMAGE }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ env.VERSION }}
            org.opencontainers.image.description=TwitchMiner daemon (drops and channel points)
