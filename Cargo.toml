[workspace]
resolver = "3"
members = ["crates/*", "apps/*"]

[workspace.package]
version = "0.1.6"
edition = "2024"
rust-version = "1.91"
license = "MIT"
repository = "https://github.com/Thinsh0/TwitchMiner"

[workspace.dependencies]
tm-twitch = { path = "crates/twitch" }
tm-core = { path = "crates/core" }
tm-modules = { path = "crates/modules" }
tm-server = { path = "crates/server" }
tm-app = { path = "crates/app" }
tm-client = { path = "crates/client" }
tm-ui = { path = "crates/ui" }

tokio = { version = "1.47", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal", "fs"] }
tokio-util = { version = "0.7", features = ["rt"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
async-trait = "0.1"

reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "http2", "gzip", "json", "form", "query", "system-proxy"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-native-certs = "0.8"
webpki-roots = "1"
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio-tungstenite = { version = "0.29", default-features = false, features = ["handshake", "stream", "__rustls-tls"] }
url = "2.5"

serde = { version = "1", features = ["derive", "rc"] }
serde_json = "1"
schemars = { version = "1", features = ["derive"] }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["serde", "clock", "std"] }
rand = "0.9"
uuid = { version = "1", features = ["v4", "serde"] }

thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt", "registry"] }
tracing-appender = "0.2"
parking_lot = "0.12"
arc-swap = "1.7"

rusqlite = { version = "0.40", features = ["bundled", "serde_json"] }
directories = "6"

axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive", "env"] }

slint = "1.18"
slint-build = "1.18"
open = "5"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

# Small binaries for mobile / embedded builds: `cargo build --profile release-small`
[profile.release-small]
inherits = "release"
opt-level = "s"
